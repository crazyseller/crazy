<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY SELLER - Fastest Instagram Growth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            margin: auto;
            border: 1px solid #334155;
        }
        h1 {
            color: #fbbf24;
            margin-bottom: 5px;
            font-size: 26px;
        }
        p.subtitle {
            color: #38bdf8;
            font-size: 14px;
            margin-top: 0;
        }
        .delivery-notice {
            background-color: #334155;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #facc15;
            margin-bottom: 15px;
        }
        .btn-google {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
        }
        .form-group {
            text-align: left;
            margin-top: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            color: #cbd5e1;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #475569;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
        }
        .btn-pay {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
        }
        optgroup {
            color: #fbbf24;
            background-color: #1e293b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💥 CRAZY SELLER 💥</h1>
    <p class="subtitle">100% Safe & Secure Services</p>

    <div class="delivery-notice">
        ⏳ Followers: 24 Hours Delivery | ⚡ Others: Instant 10 Mins
    </div>

    <!-- Google Login -->
    <button class="btn-google" onclick="googleLogin()">Continue with Google</button>

    <div class="form-group">
        <!-- Full Price List Dropdown -->
        <label for="package">Select Service & Package:</label>
        <select id="package">
            <optgroup label="👥 1. Instagram Fake Followers (24 Hrs)">
                <option value="Fake Followers - 200 Followers (₹20)">200 Followers - ₹20</option>
                <option value="Fake Followers - 1K Followers (₹53)">1K Followers - ₹53</option>
                <option value="Fake Followers - 2K Followers (₹120)">2K Followers - ₹120</option>
            </optgroup>

            <optgroup label="🔥 2. Instagram Real Active (24 Hrs)">
                <option value="Real Active - 200 Real Active (₹50)">200 Real Active - ₹50</option>
                <option value="Real Active - 1K Real Active (₹250)">1K Real Active - ₹250</option>
            </optgroup>

            <optgroup label="👁️ 3. Views (10 Mins)">
                <option value="Views - 5K Views (₹20)">5K Views - ₹20</option>
                <option value="Views - 10K Views (₹30)">10K Views - ₹30</option>
                <option value="Views - 50K Views (₹50)">50K Views - ₹50</option>
                <option value="Views - 100K Views (₹75)">100K Views - ₹75</option>
                <option value="Views - 500K Views (₹120)">500K Views - ₹120</option>
            </optgroup>

            <optgroup label="❤️ 4. Likes (10 Mins)">
                <option value="Likes - 500 Likes (₹10)">500 Likes - ₹10</option>
                <option value="Likes - 1K Likes (₹20)">1K Likes - ₹20</option>
                <option value="Likes - 5K Likes (₹50)">5K Likes - ₹50</option>
                <option value="Likes - 10K Likes (₹75)">10K Likes - ₹75</option>
            </optgroup>

            <optgroup label="💬 5. Comments (10 Mins)">
                <option value="Comments - 50 Comments (₹10)">50 Comments - ₹10</option>
                <option value="Comments - 100 Comments (₹20)">100 Comments - ₹20</option>
                <option value="Comments - 500 Comments (₹50)">500 Comments - ₹50</option>
                <option value="Comments - 1K Comments (₹75)">1K Comments - ₹75</option>
            </optgroup>

            <optgroup label="⚡ 6. Story Views & ⭐️ 7. Blue Tick">
                <option value="Story Views - 200 Story Views (₹10)">200 Story Views - ₹10</option>
                <option value="Story Views - 1K Story Views (₹250)">1K Story Views - ₹25</option>
                <option value="Blue Tick - Permanent (₹600)">Blue Tick (Permanent) - ₹600</option>
            </optgroup>
        </select>

        <!-- Instagram Username Input -->
        <label for="instaLink">Instagram Profile Link / Username:</label>
        <input type="text" id="instaLink" placeholder="@your_username">
    </div>

    <!-- Submit Button -->
    <button class="btn-pay" onclick="submitOrder()">Order via WhatsApp</button>
</div>

<script>
    function googleLogin() {
        alert("Google Login successfully clicked!");
    }

    function submitOrder() {
        var selectedPackage = document.getElementById("package").value;
        var instaUser = document.getElementById("instaLink").value;

        if (instaUser === "") {
            alert("Please enter your Instagram Username!");
            return;
        }

    
        var myPhoneNumber = "918122798837"; 

        var message = "Hello CRAZY SELLER! New Order Received:%0A" +
                      "*Selected Package:* " + selectedPackage + "%0A" +
                      "*Instagram Details:* " + instaUser;

        var whatsappUrl = "https://wa.me/" + myPhoneNumber + "?text=" + message;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
