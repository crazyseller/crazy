    <style>

        body {

        .brand-badge {

            background: linear-gradient(to right, #a855f7, #ec4899, #f43f5e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;

            background: rgba(15, 23, 42, 0.9); border: 1px solid #374151;
            border-radius: 16px; padding: 18px; margin-top: 15px; text-align: left;
        }
        label { font-weight: 600; font-size: 12px; color: #9ca3af; display: block; margin-top: 12px; }

            border-radius: 12px; background-color: #0f172a; color: #ffffff; font-size: 13px; outline: none;
        }

        option { color: #ffffff; background-color: #0f172a; padding: 8px; }

        .btn-pay {

            border: none; padding: 14px; border-radius: 12px; cursor: pointer;
            font-weight: 700; width: 100%; margin-top: 15px; font-size: 15px;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3);
        }
        .btn-pay:hover { transform: translateY(-2px); opacity: 0.95; }
        .btn-status {
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;
            border: none; padding: 12px; border-radius: 10px; cursor: pointer;
            font-weight: 700; width: 100%; margin-top: 10px; font-size: 13px;
        }
        .status-box {
            display: none; margin-top: 15px; padding: 12px; border-radius: 12px;
            background: #0f172a; border: 1px solid #374151; font-size: 13px; text-align: center;
        }
        .support-banner {
            background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 14px; padding: 12px; margin-top: 15px; text-align: center;
        }
    </style>
</head>
<body>

                <option value="10K High Capacity Views (ID: 2116)" data-service-id="2116" data-qty="10000" data-price="30">💎 10K High Capacity Views - ₹30</option>

                <option value="1K Super Fast Likes 365Days (ID: 2118)" data-service-id="2118" data-qty="1000" data-price="20">❤️ 1K Likes (365 Days) - ₹20</option>

        <input type="text" id="checkOrderId" placeholder="E.g., 23501">

<!-- LIVE CHATBOT INTEGRATION (Tawk.to Free AI Chatbot) -->
<script type="text/javascript">
var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
s1.async=true;
s1.src='https://embed.tawk.to/65d8a0f98d261e1b5f64b4c5/default';
s1.charset='UTF-8';
s1.setAttribute('crossorigin','*');
s0.parentNode.insertBefore(s1,s0);
})();
</script>

<script>
    const UPI_ID = "8124271142@naviaxis";
    const BACKEND_URL = "https://crazy-v97r.onrender.com/order";

    function updateQR() {
        var selectElem = document.getElementById("package");
        var selectedOption = selectElem.options[selectElem.selectedIndex];
        var price = selectedOption.getAttribute("data-price");
        
        var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=" + UPI_ID + "%26pn=CRAZY_SELLER%26am=" + price + "%26cu=INR";
        document.getElementById("qrImage").src = qrUrl;
        document.getElementById("payAmountText").innerText = "Amount to Pay: ₹" + price;
    }
    
    window.onload = updateQR;

    function sendToTelegram() {
        var selectElem = document.getElementById("package");
        var selectedOption = selectElem.options[selectElem.selectedIndex];
        var btn = document.getElementById("subBtn");
        
        var payload = {
            serviceId: selectedOption.getAttribute("data-service-id"),
            quantity: selectedOption.getAttribute("data-qty"),
            price: selectedOption.getAttribute("data-price"),
            packageName: selectedOption.value,
            instaLink: document.getElementById("instaLink").value,
            txnId: document.getElementById("transactionId").value
        };

        if (!payload.instaLink || !payload.txnId || payload.txnId.length < 10) {
            alert("Please enter valid Instagram Link and 12-digit Payment UTR ID!");
            return;
        }

        btn.innerText = "Processing Order...";
        btn.disabled = true;

        fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = "Submit Order Verification ⚡";
            btn.disabled = false;
            
            if (data.success) {
                alert("Order Submitted Successfully! Ref ID: " + data.refId + "\nAdmin will verify profit and start order.");
                document.getElementById("instaLink").value = "";
                document.getElementById("transactionId").value = "";
            } else {
                alert("Error placing order. Please try again.");
            }
        })
        .catch(err => {
            btn.innerText = "Submit Order Verification ⚡";
            btn.disabled = false;
            alert("Server warming up! Please click submit once again.");
        });
    }

    function checkStatus() {
        var orderId = document.getElementById("checkOrderId").value;
        var resultBox = document.getElementById("statusResult");

        if (!orderId) {
            alert("Please enter a valid SMM Order ID!");
            return;
        }

        resultBox.style.display = "block";
        resultBox.innerHTML = "Fetching live status...";

        fetch(`https://crazy-v97r.onrender.com/status/${orderId}`)
        .then(response => response.json())
        .then(data => {
            if (data.status) {
                let statusColor = "#facc15";
                if (data.status === "Completed") statusColor = "#22c55e";
                if (data.status === "Canceled" || data.status === "Partial") statusColor = "#ef4444";

                resultBox.innerHTML = `
                    <b>Order ID:</b> #${orderId}<br>
                    <b>Status:</b> <span style="color:${statusColor}; font-weight:bold;">${data.status}</span><br>
                    <b>Remains:</b> ${data.remains || 0}
                `;
            } else {
                resultBox.innerHTML = `<span style="color:#ef4444;">Order ID not found or invalid!</span>`;
            }
        })
        .catch(err => {
            resultBox.innerHTML = `<span style="color:#ef4444;">Error checking status. Try again!</span>`;
        });
    }
</script>

</body>
