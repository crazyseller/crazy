<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY SELLER - Automated SMM Store</title>
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #ffffff; margin: 0; padding: 20px 15px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 450px;
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px);
            padding: 30px 22px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
        }
        .brand-badge {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            padding: 4px 12px; border-radius: 20px; font-size: 11px;
            font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
        }
        h1 {
            background: linear-gradient(to right, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0 5px 0; font-size: 26px; font-weight: 900;
        }
        .card {
            background: rgba(15, 23, 42, 0.6); border: 1px solid #334155;
            border-radius: 14px; padding: 15px; margin-top: 15px; text-align: left;
        }
        label { font-weight: 600; font-size: 13px; color: #cbd5e1; display: block; margin-top: 10px; }
        select, input {
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #334155;
            border-radius: 10px; background-color: #0f172a; color: #ffffff; font-size: 14px; outline: none;
        }
        optgroup { color: #facc15; background-color: #020617; }
        option { color: #ffffff; background-color: #0f172a; padding: 8px; }
        .qr-box { text-align: center; margin: 15px 0; background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 12px; }
        .btn-pay {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white;
            border: none; padding: 14px; border-radius: 10px; cursor: pointer;
            font-weight: 700; width: 100%; margin-top: 15px; font-size: 15px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        .btn-status {
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;
            border: none; padding: 10px; border-radius: 8px; cursor: pointer;
            font-weight: 700; width: 100%; margin-top: 10px; font-size: 13px;
        }
        .status-box {
            display: none; margin-top: 15px; padding: 12px; border-radius: 10px;
            background: #1e293b; border: 1px solid #475569; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="brand-badge">Automated Store</span>
    <h1>CRAZY SELLER</h1>
    <p style="color: #94a3b8; font-size: 12px; margin: 0;">Instant Instagram Growth Services</p>

    <!-- SECTION 1: NEW ORDER FORM -->
    <div class="card">
        <h3 style="margin: 0 0 10px 0; color: #f59e0b; font-size: 16px;">🚀 Place New Order</h3>
        
        <label for="package">Select Service Package:</label>
        <select id="package" onchange="updateQR()">
            <optgroup label="────── 👥 FOLLOWERS PACKS ──────">
                <option value="1K Followers (ID: 2115)" data-service-id="2115" data-qty="1000" data-price="80">👥 1K Followers - ₹80</option>
                <option value="1K Followers (ID: 2116)" data-service-id="2116" data-qty="1000" data-price="85">👥 1K HQ Followers - ₹85</option>
                <option value="1K Followers (ID: 1812)" data-service-id="1812" data-qty="1000" data-price="90">👥 1K Real Followers - ₹90</option>
            </optgroup>

            <optgroup label="────── ❤️ LIKES & VIEWS ──────">
                <option value="1K Likes (ID: 2144)" data-service-id="2144" data-qty="1000" data-price="20">❤️ 1K Instagram Likes - ₹20</option>
                <option value="1K Likes (ID: 476)" data-service-id="476" data-qty="1000" data-price="25">❤️ 1K Fast Likes - ₹25</option>
                <option value="100K Views (ID: 2134)" data-service-id="2134" data-qty="100000" data-price="75">👁️ 100K Reel Views - ₹75</option>
            </optgroup>

            <optgroup label="────── 💬 COMMENTS & OTHER ──────">
                <option value="50 Comments (ID: 573)" data-service-id="573" data-qty="50" data-price="40">💬 50 Custom Comments - ₹40</option>
                <option value="Combo Pack (ID: 1823)" data-service-id="1823" data-qty="1000" data-price="140">🔥 Mega Combo Pack - ₹140</option>
            </optgroup>
        </select>

        <!-- Dynamic QR Code Display -->
        <div class="qr-box">
            <p style="color: #4ade80; font-size: 13px; font-weight: bold; margin: 0 0 8px 0;">
                Scan QR to Pay via PhonePe / GPay / Paytm:
            </p>
            <img id="qrImage" src="" alt="UPI QR Code" style="border-radius: 12px; border: 2px solid #22c55e; width: 170px; height: 170px;">
            <p style="color: #cbd5e1; font-size: 12px; margin: 8px 0 0 0;">UPI ID: <b>8124271142@naviaxis</b></p>
            <p id="payAmountText" style="color: #facc15; font-size: 14px; font-weight: bold; margin-top: 4px;"></p>
        </div>

        <label for="instaLink">Instagram Post / Profile Link:</label>
        <input type="text" id="instaLink" placeholder="https://instagram.com/p/xxx or @username">

        <label for="transactionId">Payment UTR / Transaction ID (12 Digits):</label>
        <input type="text" id="transactionId" placeholder="Enter 12-digit UTR Number">

        <button class="btn-pay" onclick="submitToAdmin()">Submit & Verify Order ⚡</button>
    </div>

    <!-- SECTION 2: TRACK ORDER STATUS -->
    <div class="card" style="border-color: #3b82f6;">
        <h3 style="margin: 0 0 10px 0; color: #60a5fa; font-size: 16px;">🔍 Track Live Order Status</h3>
        <label for="checkOrderId">Enter Order ID:</label>
        <input type="text" id="checkOrderId" placeholder="E.g., 23501">
        <button class="btn-status" onclick="checkStatus()">Check Status</button>
        
        <div id="statusResult" class="status-box"></div>
    </div>
</div>

<script>
    // Configuration Credentials
    const SMM_API_KEY = "59ebc87f01ec0285a4f05839ee9e2cc5"; 
    const SMM_API_URL = "https://smmaddaa.in/api/v2";
    const UPI_ID = "8124271142@naviaxis";
    
    // Telegram Bot Details
    const BOT_TOKEN = "8641377433:AAFWIklwfaff6lAVHxCYwUowGHpvYCbjMYo";
    const CHAT_ID = "8435445040";

    // Auto Dynamic QR Generator
    function updateQR() {
        var selectElem = document.getElementById("package");
        var selectedOption = selectElem.options[selectElem.selectedIndex];
        var price = selectedOption.getAttribute("data-price");
        
        var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=" + UPI_ID + "%26pn=CRAZY_SELLER%26am=" + price + "%26cu=INR";
        document.getElementById("qrImage").src = qrUrl;
        document.getElementById("payAmountText").innerText = "Amount to Pay: ₹" + price;
    }
    
    window.onload = updateQR;

    // 1. Submit Order Details to Secret Admin Telegram Bot
    function submitToAdmin() {
        var selectElem = document.getElementById("package");
        var selectedOption = selectElem.options[selectElem.selectedIndex];
        var serviceId = selectedOption.getAttribute("data-service-id");
        var quantity = selectedOption.getAttribute("data-qty");
        var price = selectedOption.getAttribute("data-price");
        var packageName = selectedOption.value;
        var instaLink = document.getElementById("instaLink").value;
        var txnId = document.getElementById("transactionId").value;

        if (!instaLink || !txnId || txnId.length < 10) {
            alert("Please enter valid Instagram Link and 12-digit Payment UTR ID!");
            return;
        }

        // Direct SMMAddaa API link generator for Admin One-Click Approval
        var apiLink = SMM_API_URL + "?key=" + SMM_API_KEY + "&action=add&service=" + serviceId + "&link=" + encodeURIComponent(instaLink) + "&quantity=" + quantity;

        // Message to Admin Telegram
        var msgText = "🚨 *NEW ORDER VERIFICATION REQUEST* 🚨%0A%0A" +
                      "📦 *Package:* " + packageName + "%0A" +
                      "💰 *Amount Paid:* ₹" + price + "%0A" +
                      "🔗 *Target Link:* " + instaLink + "%0A" +
                      "🔢 *UTR Number:* `" + txnId + "`%0A%0A" +
                      "👇 *Click below to send order to SMMAddaa Panel after Payment Check:*%0A" +
                      apiLink;

        // Send to Telegram Bot API
        fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + msgText + "&parse_mode=Markdown")
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                alert("🎉 Order Submitted!\nYour Payment UTR is sent for instant Admin Verification.\nYour order will start in 2-5 minutes!");
                document.getElementById("instaLink").value = "";
                document.getElementById("transactionId").value = "";
            } else {
                alert("Error submitting request. Please try again.");
            }
        })
        .catch(err => alert("Connection error. Try again!"));
    }

    // 2. Track Order Status Function
    function checkStatus() {
        var orderId = document.getElementById("checkOrderId").value;
        var resultBox = document.getElementById("statusResult");

        if (!orderId) {
            alert("Please enter a valid Order ID!");
            return;
        }

        resultBox.style.display = "block";
        resultBox.innerHTML = "Fetching status from server...";

        fetch(SMM_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                'key': SMM_API_KEY,
                'action': 'status',
                'order': orderId
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status) {
                let statusColor = "#facc15";
                if (data.status === "Completed") statusColor = "#22c55e";
                if (data.status === "Canceled" || data.status === "Partial") statusColor = "#ef4444";

                resultBox.innerHTML = `
                    <b>Order ID:</b> #${orderId}<br>
                    <b>Status:</b> <span style="color:${statusColor}; font-weight:bold;">${data.status}</span><br>
                    <b>Remains:</b> ${data.remains || 0}
                `;
            } else {
                resultBox.innerHTML = `<span style="color:#ef4444;">Order ID not found or Manual Verification in progress.</span>`;
            }
        })
        .catch(err => {
            resultBox.innerHTML = `<span style="color:#ef4444;">Error checking status.</span>`;
        });
    }
</script>

</body>
</html>
