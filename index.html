<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY SELLER - Fastest Instagram Growth</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #ffffff;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px 22px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .brand-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 {
            background: linear-gradient(to right, #fbbf24, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 6px 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 18px;
        }
        .delivery-notice {
            background: rgba(51, 65, 85, 0.5);
            border: 1px dashed rgba(250, 204, 21, 0.4);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #facc15;
            margin-bottom: 22px;
            font-weight: 500;
        }
        .btn-google {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 22px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
        }
        .btn-google:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .combo-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 22px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .combo-card::before {
            content: "BEST VALUE";
            position: absolute;
            top: 12px;
            right: -25px;
            background: #ef4444;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 25px;
            transform: rotate(45deg);
        }
        .combo-card h3 {
            margin: 0 0 12px 0;
            color: #f43f5e;
            font-size: 17px;
            text-align: center;
            font-weight: 800;
        }
        .combo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .combo-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .combo-price {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #4ade80;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 10px;
        }
        .form-group {
            text-align: left;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 16px;
            color: #cbd5e1;
            font-size: 14px;
        }
        
        /* Dropdown Options Design Improvements */
        select {
            width: 100%;
            padding: 14px 15px;
            margin-top: 8px;
            border: 2px solid #334155;
            border-radius: 12px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            line-height: 1.6;
        }
        select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }
        optgroup {
            color: #facc15;
            background-color: #020617;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 0;
        }
        option {
            color: #ffffff;
            background-color: #0f172a;
            padding: 12px;
            font-size: 14px;
            font-weight: normal;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin-top: 8px;
            border: 2px solid #334155;
            border-radius: 12px;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }
        .btn-pay {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
            letter-spacing: 0.5px;
        }
        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <span class="brand-badge">Official Store</span>
    <h1>CRAZY SELLER</h1>
    <p class="subtitle">100% Safe & Instant Instagram Services</p>

    <div class="delivery-notice">
        ⚡ Followers: 24h Delivery | Others: 10 Mins Instant
    </div>

    <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
    </button>

    <!-- Mega Combo Card -->
    <div class="combo-card">
        <h3>🔥 MEGA COMBO PACK</h3>
        <div class="combo-grid">
            <div class="combo-item">👁️ 100K Views</div>
            <div class="combo-item">❤️ 2K Likes</div>
            <div class="combo-item">💬 50+ Comments</div>
            <div class="combo-item">👥 100 Real Active</div>
        </div>
        <div class="combo-price">Special Price: ₹140 Only</div>
    </div>

    <div class="form-group">
        <label for="package">Select Package:</label>
        <select id="package">
            <optgroup label="────── 🔥 SPECIAL OFFER ──────">
                <option value="Mega Combo - 100K Views + 2K Likes + 50 Comments + 100 Real Followers (₹140)">
                    🔥 Mega Combo Pack - ₹140
                </option>
            </optgroup>

            <optgroup label="────── 👥 1. FAKE FOLLOWERS (24 Hrs) ──────">
                <option value="Fake Followers - 200 Followers (₹20)">200 Followers - ₹20</option>
                <option value="Fake Followers - 1K Followers (₹83)">1K Followers - ₹83</option>
                <option value="Fake Followers - 2K Followers (₹120)">2K Followers - ₹120</option>
            </optgroup>

            <optgroup label="────── 🔥 2. REAL ACTIVE FOLLOWERS ──────">
                <option value="Real Active - 200 Real Active (₹50)">200 Real Active - ₹50</option>
                <option value="Real Active - 1K Real Active (₹340)">1K Real Active - ₹340</option>
            </optgroup>

            <optgroup label="────── 👁️ 3. INSTAGRAM VIEWS ──────">
                <option value="Views - 5K Views (₹20)">5K Views - ₹20</option>
                <option value="Views - 10K Views (₹30)">10K Views - ₹30</option>
                <option value="Views - 50K Views (₹50)">50K Views - ₹50</option>
                <option value="Views - 100K Views (₹75)">100K Views - ₹75</option>
                <option value="Views - 500K Views (₹120)">500K Views - ₹120</option>
            </optgroup>

            <optgroup label="────── ❤️ 4. INSTAGRAM LIKES ──────">
                <option value="Likes - 500 Likes (₹10)">500 Likes - ₹10</option>
                <option value="Likes - 1K Likes (₹20)">1K Likes - ₹20</option>
                <option value="Likes - 5K Likes (₹50)">5K Likes - ₹50</option>
                <option value="Likes - 10K Likes (₹75)">10K Likes - ₹75</option>
            </optgroup>

            <optgroup label="────── 💬 5. CUSTOM COMMENTS ──────">
                <option value="Comments - 50 Comments (₹10)">50 Comments - ₹10</option>
                <option value="Comments - 100 Comments (₹20)">100 Comments - ₹20</option>
                <option value="Comments - 500 Comments (₹50)">500 Comments - ₹50</option>
                <option value="Comments - 1K Comments (₹75)">1K Comments - ₹75</option>
            </optgroup>

            <optgroup label="────── ⚡ 6. STORY VIEWS & ⭐️ BLUE TICK ──────">
                <option value="Story Views - 200 Story Views (₹10)">200 Story Views - ₹10</option>
                <option value="Story Views - 1K Story Views (₹25)">1K Story Views - ₹25</option>
                <option value="Blue Tick - Permanent (₹600)">Blue Tick (Permanent) - ₹600</option>
            </optgroup>
        </select>

        <label for="instaLink">Instagram Username or Profile Link:</label>
        <input type="text" id="instaLink" placeholder="@your_username">
    </div>

    <button class="btn-pay" onclick="submitOrder()">Order via WhatsApp 🚀</button>
</div>

<script>
    function googleLogin() {
        alert("Google Login successfully clicked!");
    }

    function submitOrder() {
        var selectedPackage = document.getElementById("package").value;
        var instaUser = document.getElementById("instaLink").value;

        if (instaUser === "") {
            alert("Please enter your Instagram Username!");
            return;
        }

        var myPhoneNumber = "918122798837"; 

        var message = "Hello CRAZY SELLER! New Order Received:%0A" +
                      "*Selected Package:* " + selectedPackage + "%0A" +
                      "*Instagram Details:* " + instaUser;

        var whatsappUrl = "https://wa.me/" + myPhoneNumber + "?text=" + message;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
