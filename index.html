<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY SELLER - Ultra Modern SMM Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #ec4899;
            --secondary-glow: rgba(236, 72, 153, 0.4);
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --input-bg: rgba(31, 41, 55, 0.6);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gold: #f59e0b;
        }

        * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px 120px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 28px 22px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--primary-glow);
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--secondary-glow);
            display: inline-block;
            margin-bottom: 8px;
            color: #fff;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 4px 0 2px 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #fb7185);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 0;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .card {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            margin-top: 18px;
            text-align: left;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #c084fc;
        }

        label {
            font-weight: 700;
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow), inset 0 2px 4px rgba(0, 0, 0, 0.2);
            background-color: rgba(31, 41, 55, 0.8);
        }

        optgroup { color: #facc15; background-color: #111827; font-weight: bold; }
        option { color: #ffffff; background-color: #1f2937; padding: 10px; }

        .price-badge-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 14px;
            border-radius: 18px;
            margin-top: 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .price-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        .qr-box {
            text-align: center;
            margin: 18px 0 10px 0;
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .qr-box img {
            width: 170px;
            height: 170px;
            border-radius: 16px;
            border: 2px solid var(--primary);
            padding: 6px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px var(--secondary-glow);
            text-transform: uppercase;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-badge">Official Store</div>
    <h1>CRAZY SELLER</h1>
    <p class="sub-title">Instant Instagram Growth Services</p>

    <div class="card">
        <div class="card-header">
            <h3>🚀 Place New Order</h3>
        </div>
        
        <label for="package">Select Service:</label>
        <select id="package" onchange="calculatePriceAndQR()">
            <optgroup label="👥 1. Instagram Fake Followers">
                <option value="200 Fake Followers" data-price="20">👥 200 Followers - ₹20</option>
                <option value="1K Fake Followers" data-price="83">👥 1K Followers - ₹83</option>
                <option value="2K Fake Followers" data-price="120">👥 2K Followers - ₹120</option>
            </optgroup>

            <optgroup label="🔥 2. Instagram Real Active">
                <option value="200 Real Active Followers" data-price="50">🔥 200 Real Active - ₹50</option>
                <option value="1K Real Active Followers" data-price="340">🔥 1K Real Active - ₹340</option>
            </optgroup>

            <optgroup label="👁️ 3. Views">
                <option value="5K Views" data-price="20">👁️ 5K Views - ₹20</option>
                <option value="10K Views" data-price="30">👁️ 10K Views - ₹30</option>
                <option value="50K Views" data-price="50">👁️ 50K Views - ₹50</option>
                <option value="100K Views" data-price="75">👁️ 100K Views - ₹75</option>
                <option value="500K Views" data-price="120">👁️ 500K Views - ₹120</option>
            </optgroup>

            <optgroup label="❤️ 4. Likes">
                <option value="500 Likes" data-price="10">❤️ 500 Likes - ₹10</option>
                <option value="1K Likes" data-price="20">❤️ 1K Likes - ₹20</option>
                <option value="5K Likes" data-price="50">❤️ 5K Likes - ₹50</option>
                <option value="10K Likes" data-price="75">❤️ 10K Likes - ₹75</option>
            </optgroup>

            <optgroup label="💬 5. Comments">
                <option value="50 Custom Comments" data-price="10">💬 50 Comments - ₹10</option>
                <option value="100 Custom Comments" data-price="20">💬 100 Comments - ₹20</option>
                <option value="500 Custom Comments" data-price="50">💬 500 Comments - ₹50</option>
                <option value="1K Custom Comments" data-price="75">💬 1K Comments - ₹75</option>
            </optgroup>

            <optgroup label="⚡ 6. Story Views">
                <option value="200 Story Views" data-price="10">⚡ 200 Story Views - ₹10</option>
                <option value="1K Story Views" data-price="25">⚡ 1K Story Views - ₹25</option>
            </optgroup>
        </select>

        <div class="price-badge-box">
            <span style="font-size: 11px; color: var(--text-muted); font-weight: 700;">TOTAL PRICE:</span>
            <div class="price-text" id="liveCalculatedPrice">₹20</div>
        </div>

        <div class="qr-box">
            <p style="color: #34d399; font-size: 11px; font-weight: 700; margin: 0 0 8px 0;">SCAN & PAY VIA UPI</p>
            <img id="qrImage" src="" alt="UPI QR Code">
            <p style="color: var(--text-muted); font-size: 11px; margin-top: 8px;">UPI ID: <b>8124271142@naviaxis</b></p>
        </div>

        <label for="instaLink">Instagram Profile / Post Link:</label>
        <input type="text" id="instaLink" placeholder="https://instagram.com/p/xxx or @username">

        <label for="transactionId">Payment UTR ID (12 Digits):</label>
        <input type="text" id="transactionId" maxlength="12" placeholder="Enter 12-digit UTR Number">

        <button class="btn-action" id="subBtn" onclick="sendOrderToTelegram()">Submit Order ⚡</button>
    </div>
</div>

<script>
    const UPI_ID = "8124271142@naviaxis";
    
    // Exact Telegram Credentials Configured Here
    const BOT_TOKEN = "8986935279:AAFjOyHX7fnZRKTqOZudUxyJCQjcu3_ChMk";
    const CHAT_ID = "8435445040";

    function calculatePriceAndQR() {
        var selectElem = document.getElementById("package");
        var selectedOption = selectElem.options[selectElem.selectedIndex];
        var currentPrice = selectedOption.getAttribute("data-price");
        
        document.getElementById("liveCalculatedPrice").innerText = "₹" + currentPrice;
        
        var upiRawScheme = "upi://pay?pa=" + UPI_ID + "&pn=CRAZY_SELLER&am=" + currentPrice + "&cu=INR";
        var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(upiRawScheme);
        document.getElementById("qrImage").src = qrUrl;
    }

    window.onload = function() {
        calculatePriceAndQR();
    };

    function sendOrderToTelegram() {
        var selectElem = document.getElementById("package");
        var packageName = selectElem.options[selectElem.selectedIndex].value;
        var price = selectElem.options[selectElem.selectedIndex].getAttribute("data-price");
        var link = document.getElementById("instaLink").value.trim();
        var txnId = document.getElementById("transactionId").value.trim();

        if (!link) {
            alert("Please enter Instagram Link or Username!");
            return;
        }

        if (!txnId || txnId.length !== 12 || isNaN(txnId)) {
            alert("Please enter valid 12-digit Numeric Payment UTR ID!");
            return;
        }

        var btn = document.getElementById("subBtn");
        btn.innerText = "Sending Order...";
        btn.disabled = true;

        var messageText = "🚨 NEW CRAZY SELLER ORDER! 🚨\n\n" +
                          "📦 Service: " + packageName + "\n" +
                          "💰 Amount: ₹" + price + "\n" +
                          "🔗 Link: " + link + "\n" +
                          "💳 UTR ID: " + txnId + "\n\n" +
                          "⏰ Time: " + new Date().toLocaleString();

        var telegramUrl = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";

        fetch(telegramUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: messageText
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            btn.innerText = "Submit Order ⚡";
            btn.disabled = false;

            if(data.ok) {
                alert("✅ Order Submitted Successfully!\nTelegram-ku notification anuppiyaachu.");
                document.getElementById("instaLink").value = "";
                document.getElementById("transactionId").value = "";
            } else {
                alert("❌ Telegram Error: Please start your bot @crazyseller786_bot in Telegram first!");
            }
        })
        .catch(function(err) {
            btn.innerText = "Submit Order ⚡";
            btn.disabled = false;
            alert("Network error! Please try again.");
        });
    }
</script>

</body>
</html>
